<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="An orchestrator node connected to three agent nodes, with a loop-back arrow">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0a0f1e" />
			<stop offset="1" stop-color="#151d35" />
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#0693e3" stop-opacity="0.45" />
			<stop offset="1" stop-color="#0693e3" stop-opacity="0" />
		</radialGradient>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" fill="#0693e3" />
		</marker>
		<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
			<path d="M32 0H0V32" fill="none" stroke="#98a2c6" stroke-opacity="0.08" />
		</pattern>
	</defs>

	<rect width="640" height="360" fill="url(#bg)" />
	<rect width="640" height="360" fill="url(#grid)" />
	<circle cx="320" cy="150" r="170" fill="url(#glow)" />

	<!-- edges: orchestrator to agents -->
	<g stroke="#0693e3" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
		<path d="M290 175 C 230 215, 170 235, 130 262" />
		<path d="M320 182 L320 252" />
		<path d="M350 175 C 410 215, 470 235, 510 262" />
	</g>

	<!-- loop-back arrow: results return and the graph cycles -->
	<path d="M548 292 C 600 292, 606 150, 400 138" fill="none" stroke="#98a2c6" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round" marker-end="url(#arrow)" />

	<!-- orchestrator -->
	<rect x="240" y="96" width="160" height="82" rx="16" fill="#0693e3" />
	<text x="320" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.8">ORCHESTRATOR</text>
	<text x="320" y="156" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">State + Control</text>

	<!-- agents -->
	<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
		<rect x="60" y="264" width="140" height="56" rx="12" fill="#151d35" stroke="#0693e3" stroke-width="2" />
		<text x="130" y="298" font-size="17" font-weight="600" fill="#ffffff">Retriever</text>

		<rect x="250" y="254" width="140" height="56" rx="12" fill="#151d35" stroke="#0693e3" stroke-width="2" />
		<text x="320" y="288" font-size="17" font-weight="600" fill="#ffffff">Planner</text>

		<rect x="440" y="264" width="140" height="56" rx="12" fill="#151d35" stroke="#0693e3" stroke-width="2" />
		<text x="510" y="298" font-size="17" font-weight="600" fill="#ffffff">Validator</text>
	</g>

	<text x="36" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#98a2c6">AI AGENT ORCHESTRATION</text>
	<text x="604" y="52" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#98a2c6">chains &#8594; graphs &#8594; recovery</text>
</svg>
